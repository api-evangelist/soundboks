name: Soundboks
description: >-
  Soundboks is a Danish consumer-electronics company that designs and manufactures
  loud, durable, battery-powered Bluetooth party speakers (Soundboks 4, Soundboks
  Mix) plus companion products such as Lightboks party lights. Products are sold
  direct-to-consumer through a Shopify-powered storefront and controlled with a
  companion iOS/Android app that supports wireless playback and multi-speaker
  pairing (TeamUp). Soundboks does not publish a first-party developer API or SDK;
  its only programmatic surface is the Shopify Customer Account API (OAuth 2.0 /
  OpenID Connect) exposed on its own store domain via the standard Shopify
  discovery documents, which is what this enrichment pass captured.
